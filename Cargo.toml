[workspace]
resolver = "3"
members = ["vorb3", "tools/attack", "tools/bench", "tools/ctgrind"]
default-members = ["vorb3", "tools/attack", "tools/bench", "tools/ctgrind"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
panic = "unwind"

[profile.test]
opt-level = 1
overflow-checks = true
