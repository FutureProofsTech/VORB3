[package]
name = "vorb3-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[features]
default = []
nist1 = ["vorb3/nist1"]
nist3 = ["vorb3/nist3"]

[dependencies]
libfuzzer-sys = "0.4"
vorb3 = { path = "../vorb3" }

[[bin]]
name = "verify"
path = "fuzz_targets/verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_any"
path = "fuzz_targets/verify_any.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sign"
path = "fuzz_targets/sign.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "field"
path = "fuzz_targets/field.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rain"
path = "fuzz_targets/rain.rs"
test = false
doc = false
bench = false
