[package]
name = "vorb3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "VORB3-SP1 post-quantum signature library (SP-288/35)"
readme = "README.md"
keywords = ["cryptography", "post-quantum", "signature", "no-std"]
categories = ["cryptography", "no-std"]

[features]
default = []
bench-api = []

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
expect_used = "deny"
missing_inline_in_public_items = "deny"
exhaustive_structs = "deny"
alloc_instead_of_core = "deny"
std_instead_of_core = "deny"
std_instead_of_alloc = "deny"

[[test]]
name = "bench_api"
path = "tests/bench_api.rs"
required-features = ["bench-api"]
